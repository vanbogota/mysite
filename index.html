<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>bogdanov.io</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📻</text></svg>">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Your playground: put anything here. -->
  <h1 class="sign">Enjoy your time</h1>
  <!-- Liquid-glass look for .sign: the glyphs become a soft rounded height map, lit from the top left -->
  <svg width="0" height="0" style="position: absolute" aria-hidden="true">
    <filter id="liquid-glass" x="-10%" y="-30%" width="120%" height="180%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="height"/>
      <feSpecularLighting in="height" surfaceScale="8" specularConstant="3" specularExponent="40" lighting-color="#fff" result="light">
        <feDistantLight azimuth="225" elevation="45"/>
      </feSpecularLighting>
      <feComposite in="light" in2="SourceAlpha" operator="in" result="gloss"/>
      <!-- thin bright edge all around the glyphs -->
      <feMorphology in="SourceAlpha" operator="erode" radius="1.5" result="inner"/>
      <feComposite in="SourceAlpha" in2="inner" operator="out" result="edgeShape"/>
      <feFlood flood-color="#fff" flood-opacity=".7"/>
      <feComposite in2="edgeShape" operator="in" result="edge"/>
      <!-- darker band along the lower-right rim, where light leaves the glass -->
      <feOffset in="height" dx="-3" dy="-4" result="shifted"/>
      <feComposite in="SourceAlpha" in2="shifted" operator="out" result="rimShape"/>
      <feFlood flood-color="#3c6a9a" flood-opacity=".45"/>
      <feComposite in2="rimShape" operator="in" result="rim"/>
      <!-- soft shadow cast on the sky -->
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="10" result="blurShadow"/>
      <feFlood flood-color="#14325a" flood-opacity=".22"/>
      <feComposite in2="blurShadow" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
        <feMergeNode in="rim"/>
        <feMergeNode in="edge"/>
        <feMergeNode in="gloss"/>
      </feMerge>
    </filter>
  </svg>
  <canvas class="grass" aria-hidden="true"></canvas>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

    const canvas = document.querySelector('.grass');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
    const phone = innerWidth < 700;
    renderer.setPixelRatio(Math.min(devicePixelRatio, phone ? 1.5 : 2));  // phones: fewer pixels, barely visible on a small screen

    const FOG = new THREE.Color('#c8dade');   // = the horizon stop of the CSS sky
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(FOG, 8, 45);
    const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
    camera.position.set(0, 2, 0);
    camera.lookAt(0, 0, -8);

    const ground = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.MeshBasicMaterial({ color: '#1a330c' }));
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // One blade: a tapered strip, y = 0 at the root to 1 at the tip.
    const SEG = 5, pos = [], idx = [];
    for (let i = 0; i < SEG; i++) {
      const y = i / SEG, w = 1 - y ** 1.5;
      pos.push(-w / 2, y, 0, w / 2, y, 0);
    }
    pos.push(0, 1, 0);
    for (let i = 0; i < SEG - 1; i++) { const a = i * 2; idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2); }
    idx.push(SEG * 2 - 2, SEG * 2 - 1, SEG * 2);

    const COUNT = phone ? 25000 : 140000;
    const spot = new Float32Array(COUNT * 2);  // x in -1..1 (scaled to the view width in the shader), distance
    const look = new Float32Array(COUNT * 4);  // height, width, yaw, random
    for (let i = 0; i < COUNT; i++) {
      spot[i * 2] = Math.random() * 2 - 1;
      // denser near the camera; ascending distance draws near blades first, so depth test skips hidden ones
      spot[i * 2 + 1] = 2 + 50 * ((i + Math.random()) / COUNT) ** 2;
      look.set([0.25 + Math.random() * 0.35, 0.03 + Math.random() * 0.03, Math.random() * Math.PI, Math.random()], i * 4);
    }
    const geo = new THREE.InstancedBufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setIndex(idx);
    geo.setAttribute('spot', new THREE.InstancedBufferAttribute(spot, 2));
    geo.setAttribute('look', new THREE.InstancedBufferAttribute(look, 4));
    geo.instanceCount = COUNT;

    const uniforms = {
      uTime: { value: 0 },
      uHalfW: { value: 1 },
      uHand: { value: new THREE.Vector2(0, -100) },
      uPush: { value: 0 },
      uRoot: { value: new THREE.Color('#0b1f05') },
      uTip: { value: new THREE.Color('#6f9e30') },
      uTipDry: { value: new THREE.Color('#b3b85a') },
      uFogColor: { value: FOG },
      uFogNear: { value: scene.fog.near },
      uFogFar: { value: scene.fog.far },
    };
    const material = new THREE.ShaderMaterial({
      uniforms,
      side: THREE.DoubleSide,
      vertexShader: /* glsl */ `
        attribute vec2 spot;
        attribute vec4 look;
        uniform float uTime, uHalfW, uPush, uFogNear, uFogFar;
        uniform vec2 uHand;
        varying float vY, vShade, vFog, vPatch;

        void main() {
          float d = spot.y;
          vec2 root = vec2(spot.x * (d * uHalfW * 1.1 + 1.0), -d);
          float y = position.y;
          float c = cos(look.z), s = sin(look.z);
          vec3 p = vec3(position.x * look.y * c, y * look.x, position.x * look.y * s);

          // wind: a gentle lean; the sway fades in and out (cycle ≈ 6.28 / 0.6 ≈ 10 s)
          float sway = smoothstep(-0.5, 1.0, sin(uTime * 0.6 + root.x * 0.05));
          float wind = 0.12 + 0.07 * sway * sin(uTime * 1.2 + look.w * 6.28);
          vec2 bend = vec2(wind, 0.1 * sway * sin(uTime * 0.4 + root.x)) + (look.w - 0.5) * vec2(0.5, 0.4);
          // the hand brushes blades away from the cursor
          vec2 away = root - uHand;
          bend += normalize(away + 1e-5) * uPush * 1.5 * smoothstep(0.6, 0.0, length(away));

          p.xz += bend * y * y * look.x;
          p.y *= 1.0 - 0.3 * min(length(bend), 1.5) * y;  // a bent blade reaches less high

          vec4 mv = modelViewMatrix * vec4(p + vec3(root.x, 0.0, root.y), 1.0);
          gl_Position = projectionMatrix * mv;
          vY = y;
          vShade = look.w;
          vPatch = sin(root.x * 0.7 + sin(root.y * 0.5)) * sin(root.y * 0.6 - root.x * 0.2);  // lusher and drier patches
          vFog = smoothstep(uFogNear, uFogFar, -mv.z);
        }`,
      fragmentShader: /* glsl */ `
        uniform vec3 uRoot, uTip, uTipDry, uFogColor;
        varying float vY, vShade, vFog, vPatch;

        void main() {
          float dry = clamp(vShade * vShade + 0.35 * vPatch, 0.0, 1.0);
          vec3 col = mix(uRoot, mix(uTip, uTipDry, dry), pow(vY, 1.4));  // dark, shaded base; light tips
          gl_FragColor = vec4(mix(col, uFogColor, vFog), 1.0);
          #include <colorspace_fragment>
        }`,
    });
    const blades = new THREE.Mesh(geo, material);
    blades.frustumCulled = false;  // the bounds of one blade say nothing about where the instances are
    scene.add(blades);

    const resize = () => {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      uniforms.uHalfW.value = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect;
    };
    addEventListener('resize', resize);
    resize();

    // Cursor → point at mid-blade height on the lawn.
    const ray = new THREE.Raycaster(), hit = new THREE.Vector3(), handTarget = new THREE.Vector2();
    const midBlades = new THREE.Plane(new THREE.Vector3(0, 1, 0), -0.3);
    let pushTarget = 0;
    canvas.addEventListener('pointermove', (e) => {
      ray.setFromCamera(new THREE.Vector2(e.clientX / innerWidth * 2 - 1, 1 - e.clientY / innerHeight * 2), camera);
      pushTarget = ray.ray.intersectPlane(midBlades, hit) ? 1 : 0;
      canvas.style.cursor = pushTarget ? 'grab' : '';  // open palm over the grass only; the sky keeps the arrow
      if (pushTarget) handTarget.set(hit.x, hit.z);
      if (uniforms.uPush.value < 0.01) uniforms.uHand.value.copy(handTarget);
    });
    canvas.addEventListener('pointerleave', () => { pushTarget = 0; });

    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const clock = new THREE.Clock();
    renderer.setAnimationLoop(() => {
      uniforms.uHand.value.lerp(handTarget, 0.2);
      uniforms.uPush.value += (pushTarget - uniforms.uPush.value) * 0.08;
      if (!still) uniforms.uTime.value = clock.getElapsedTime();
      renderer.render(scene, camera);
    });
  </script>
  
  <!-- Radio widget -->
  <aside class="radio" id="radio" aria-label="Claude FM radio">
    <div class="head">
      <span class="title">Claude FM</span>
      <span class="live"><span class="dot"></span><span id="radio-status">Loading…</span></span>
    </div>
    <div class="screen"><div id="radio-player"></div></div>
    <div class="controls">
      <button class="play" id="radio-toggle" aria-label="Play" disabled>
        <svg viewBox="0 0 24 24"><path id="radio-icon" d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="bars" aria-hidden="true"></div>
      <input id="radio-volume" type="range" min="0" max="100" value="70" aria-label="Volume">
    </div>
    <a href="https://www.youtube.com/watch?v=tRsQsTMvPNg" target="_blank" rel="noopener">Stream on YouTube ↗</a>
    <a class="radio-linkedin" href="https://www.linkedin.com/in/ivan-bogdanov-dev/" target="_blank" rel="noopener">Find Me in LinkedIn</a>
  </aside>

  <script>
    (() => {
      const VIDEO_ID = 'tRsQsTMvPNg';
      const PLAY = 'M8 5v14l11-7z';
      const PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';

      const radio = document.getElementById('radio');
      const toggle = document.getElementById('radio-toggle');
      const icon = document.getElementById('radio-icon');
      const status = document.getElementById('radio-status');
      const volume = document.getElementById('radio-volume');

      const bars = radio.querySelector('.bars');
      for (let i = 0; i < 8; i++) {
        const s = document.createElement('span');
        s.style.animationDelay = `${-Math.random()}s`;
        s.style.animationDuration = `${0.6 + Math.random() * 0.8}s`;
        bars.appendChild(s);
      }

      try {
        const saved = localStorage.getItem('radio-volume');
        if (saved !== null) volume.value = saved;
      } catch {}

      let player;

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('radio-player', {
          videoId: VIDEO_ID,
          width: 200,
          height: 200,
          // controls: 0 hides YouTube's own play/seek UI; the widget has its own controls.
          playerVars: { loop: 1, playlist: VIDEO_ID, playsinline: 1, rel: 0, controls: 0, disablekb: 1, fs: 0, iv_load_policy: 3 },
          events: {
            onReady: () => {
              player.setVolume(+volume.value);
              toggle.disabled = false;
              status.textContent = 'Paused';
              autoplay();
            },
            onStateChange: ({ data }) => {
              const playing = data === YT.PlayerState.PLAYING;
              radio.classList.toggle('playing', playing);
              icon.setAttribute('d', playing ? PAUSE : PLAY);
              toggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
              status.textContent = playing ? (autoMuted ? '🔇 Click for sound' : 'On air')
                : data === YT.PlayerState.BUFFERING ? 'Buffering…' : 'Paused';
            },
            onError: () => { status.textContent = 'Unavailable'; },
          },
        });
      };

      // Browsers block autoplay with sound until the visitor interacts with the page.      
      const EVENTS = ['pointerdown', 'keydown', 'touchstart'];
      let autoMuted = false;
      let justUnmuted = false;
      const unmute = () => {
        EVENTS.forEach((type) => document.removeEventListener(type, unmute, true));
        autoMuted = false;
        radio.classList.remove('muted');
        player.unMute();
        player.setVolume(+volume.value);
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
        status.textContent = 'On air';
        // Don't let the same click on the play button immediately pause it again.
        justUnmuted = true;
        setTimeout(() => { justUnmuted = false; }, 500);
      };
      const autoplay = () => {
        player.playVideo();
        setTimeout(() => {
          const s = player.getPlayerState();
          const started = s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING;
          // YouTube may also fall back to muted playback on its own.
          if (started && !player.isMuted()) return;
          autoMuted = true;
          radio.classList.add('muted');
          status.textContent = '🔇 Click for sound';
          player.mute();
          player.playVideo();
          EVENTS.forEach((type) => document.addEventListener(type, unmute, true));
        }, 1000);
      };

      toggle.addEventListener('click', () => {
        if (!player || justUnmuted) return;
        player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
      });

      volume.addEventListener('input', () => {
        player?.setVolume(+volume.value);
        try { localStorage.setItem('radio-volume', volume.value); } catch {}
      });
    })();
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
