  <!-- Radio widget -->
  <aside class="radio" id="radio" aria-label="Claude FM radio">
    <div class="head">
      <span class="title">Claude FM</span>
      <span class="live"><span class="dot"></span><span id="radio-status">Loading…</span></span>
    </div>
    <div class="screen"><div id="radio-player"></div></div>
    <div class="controls">
      <button class="play" id="radio-toggle" aria-label="Play" disabled>
        <svg viewBox="0 0 24 24"><path id="radio-icon" d="M8 5v14l11-7z"/></svg>
      </button>
      <div class="bars" aria-hidden="true"></div>
      <input id="radio-volume" type="range" min="0" max="100" value="70" aria-label="Volume">
    </div>
    <a href="https://www.youtube.com/watch?v=tRsQsTMvPNg" target="_blank" rel="noopener">Stream on YouTube ↗</a>
  </aside>

  <script>
    (() => {
      const VIDEO_ID = 'tRsQsTMvPNg';
      const PLAY = 'M8 5v14l11-7z';
      const PAUSE = 'M6 5h4v14H6zm8 0h4v14h-4z';

      const radio = document.getElementById('radio');
      const toggle = document.getElementById('radio-toggle');
      const icon = document.getElementById('radio-icon');
      const status = document.getElementById('radio-status');
      const volume = document.getElementById('radio-volume');

      const bars = radio.querySelector('.bars');
      for (let i = 0; i < 8; i++) {
        const s = document.createElement('span');
        s.style.animationDelay = `${-Math.random()}s`;
        s.style.animationDuration = `${0.6 + Math.random() * 0.8}s`;
        bars.appendChild(s);
      }

      try {
        const saved = localStorage.getItem('radio-volume');
        if (saved !== null) volume.value = saved;
      } catch {}

      let player;

      window.onYouTubeIframeAPIReady = () => {
        player = new YT.Player('radio-player', {
          videoId: VIDEO_ID,
          width: 200,
          height: 200,
          playerVars: { loop: 1, playlist: VIDEO_ID, playsinline: 1, rel: 0 },
          events: {
            onReady: () => {
              player.setVolume(+volume.value);
              toggle.disabled = false;
              status.textContent = 'Paused';
              autoplay();
            },
            onStateChange: ({ data }) => {
              const playing = data === YT.PlayerState.PLAYING;
              radio.classList.toggle('playing', playing);
              icon.setAttribute('d', playing ? PAUSE : PLAY);
              toggle.setAttribute('aria-label', playing ? 'Pause' : 'Play');
              status.textContent = playing ? (autoMuted ? '🔇 Click for sound' : 'On air')
                : data === YT.PlayerState.BUFFERING ? 'Buffering…' : 'Paused';
            },
            onError: () => { status.textContent = 'Unavailable'; },
          },
        });
      };

      // Browsers block autoplay with sound until the visitor interacts with the page.      
      const EVENTS = ['pointerdown', 'keydown', 'touchstart'];
      let autoMuted = false;
      let justUnmuted = false;
      const unmute = () => {
        EVENTS.forEach((type) => document.removeEventListener(type, unmute, true));
        autoMuted = false;
        radio.classList.remove('muted');
        player.unMute();
        player.setVolume(+volume.value);
        if (player.getPlayerState() !== YT.PlayerState.PLAYING) player.playVideo();
        status.textContent = 'On air';
        // Don't let the same click on the play button immediately pause it again.
        justUnmuted = true;
        setTimeout(() => { justUnmuted = false; }, 500);
      };
      const autoplay = () => {
        player.playVideo();
        setTimeout(() => {
          const s = player.getPlayerState();
          const started = s === YT.PlayerState.PLAYING || s === YT.PlayerState.BUFFERING;
          // YouTube may also fall back to muted playback on its own.
          if (started && !player.isMuted()) return;
          autoMuted = true;
          radio.classList.add('muted');
          status.textContent = '🔇 Click for sound';
          player.mute();
          player.playVideo();
          EVENTS.forEach((type) => document.addEventListener(type, unmute, true));
        }, 1000);
      };

      toggle.addEventListener('click', () => {
        if (!player || justUnmuted) return;
        player.getPlayerState() === YT.PlayerState.PLAYING ? player.pauseVideo() : player.playVideo();
      });

      volume.addEventListener('input', () => {
        player?.setVolume(+volume.value);
        try { localStorage.setItem('radio-volume', volume.value); } catch {}
      });
    })();
  </script>
  <script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
